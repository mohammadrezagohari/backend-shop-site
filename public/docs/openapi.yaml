openapi: 3.1.0
info:
  title: Golden AID API
  version: 1.5.0
  description: >-
    مستندات کامل API فروشگاه گلدن اید، شامل مسیرهای عمومی، حساب کاربری و مدیریت.


    تمام درخواست‌ها و پاسخ‌ها JSON هستند. هدر Accept: application/json را ارسال کنید.

    برای مسیرهای محافظت‌شده، ابتدا ثبت‌نام یا ورود کنید و مقدار data.token را در Authorize وارد کنید (بدون
    پیشوند Bearer). اعتبار توکن ۷ روز است؛ خروج، توکن جاری را باطل می‌کند. مسیرهای مدیریت به کاربر دارای
    is_admin=true نیاز دارند.

    سبد خرید با X-Cart-Token شناسایی می‌شود؛ مقدار data.token را از پاسخ سبد ذخیره و در درخواست‌های بعدی ارسال
    کنید. پارامتر cart_token در query نیز پشتیبانی می‌شود. بدون توکن، سبد جدید ساخته می‌شود.

    شناسه محصولات و مقالات در مسیرهای عمومی slug، شناسه سفارش عمومی public_id و شناسه منابع مدیریت عدد داخلی
    است.

    پرداخت test صرفاً شبیه‌سازی است و تراکنش بانکی واقعی ندارد. مقادیر قیمت، همان واحد عددی ذخیره‌شده در
    فروشگاه هستند.


    APP_ENV=develop پرداخت شبیه‌سازی و پیامک لاگ دارد. APP_ENV=production از زرین‌پال و کاوه‌نگار با کلیدهای
    backend استفاده می‌کند. درخواست‌های پرداخت واقعی به مسیر عمومی payments ارسال می‌شوند.
servers:
  - url: /api/v1
    description: API روی همین سرور
tags:
  - name: احراز هویت
    description: ثبت‌نام، ورود، مشخصات کاربر و خروج
  - name: دسته‌بندی‌ها
    description: دسته‌بندی‌های فعال فروشگاه
  - name: محصولات
    description: جستجو، فیلتر و جزئیات محصول
  - name: دیدگاه‌ها
    description: مشاهده و ارسال دیدگاه محصول
  - name: مقالات
    description: مقالات منتشرشده وبلاگ
  - name: سبد خرید
    description: مدیریت سبد مهمان با X-Cart-Token
  - name: سفارش‌ها
    description: ثبت، پیگیری و سفارش‌های حساب کاربری
  - name: پرداخت
    description: پرداخت محیط توسعه و اتصال production زرین‌پال
  - name: مدیریت / داشبورد
    description: آمار مدیریتی
  - name: مدیریت / محصولات
    description: ایجاد، ویرایش و حذف محصولات
  - name: مدیریت / دسته‌بندی‌ها
    description: مدیریت دسته‌بندی‌ها
  - name: مدیریت / سفارش‌ها
    description: بررسی و تغییر وضعیت سفارش
  - name: مدیریت / کاربران
    description: فهرست کاربران و تنظیم دسترسی مدیر
  - name: مدیریت / مقالات
    description: مدیریت مقالات و پیش‌نویس‌ها
  - name: مدیریت / دیدگاه‌ها
    description: تأیید، لغو تأیید و حذف دیدگاه‌ها
  - name: نمادها و گواهی‌ها
    description: نمادهای فعال فوتر سایت
  - name: مدیریت / نمادها و گواهی‌ها
    description: مدیریت تصویر، عنوان، لینک استعلام، ترتیب و وضعیت نمادهای سایت
  - name: اتصال پلتفرم‌ها
    description: دریافت اطلاعات محصولات توسط ترب
  - name: مدیریت / پلتفرم‌ها
    description: تنظیمات غیرمحرمانه و درخواست همگام‌سازی؛ فعال‌سازی نیازمند حساب فروشندگی است
paths:
  /auth/register:
    post:
      tags:
        - احراز هویت
      summary: Register a customer and issue an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: کاربر نمونه
              email: customer@example.com
              password: ExamplePass123!
      responses:
        '201':
          $ref: '#/components/responses/AuthSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: postAuthRegister
  /auth/login:
    post:
      tags:
        - احراز هویت
      summary: Login and issue a seven-day API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: customer@example.com
              password: ExamplePass123!
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: postAuthLogin
  /auth/me:
    get:
      tags:
        - احراز هویت
      summary: Return the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
              example:
                data:
                  id: 1
                  name: example
                  email: customer@example.com
                  is_admin: false
                  created_at: '2026-11-06T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      operationId: getAuthMe
  /auth/logout:
    post:
      tags:
        - احراز هویت
      summary: Revoke the current API token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: example
        '401':
          $ref: '#/components/responses/Unauthenticated'
      operationId: postAuthLogout
  /categories:
    get:
      tags:
        - دسته‌بندی‌ها
      summary: List active storefront categories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
              example:
                data:
                  - id: 1
                    name: example
                    slug: example
                    description: example
                    image: example
                    is_active: false
                    sort_order: 1
                    products_count: 1
      operationId: getCategories
  /products:
    get:
      tags:
        - محصولات
      summary: Search and paginate active products
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: category
          in: query
          schema:
            type: string
            maxLength: 100
          description: نامک دسته؛ محصولات تمام زیردسته‌های فعال هم برمی‌گردند.
        - name: featured
          in: query
          schema:
            type: string
            enum:
              - '0'
              - '1'
          description: مقدار 1 فقط محصولات ویژه را برمی‌گرداند؛ 0 فیلتر ویژه بودن را اعمال نمی‌کند.
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 12
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - newest
              - price_asc
              - price_desc
              - popular
              - rating
            default: newest
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: tag
          in: query
          schema:
            type: string
            maxLength: 80
          description: فیلتر با یک برچسب دقیق
      responses:
        '200':
          $ref: '#/components/responses/ProductPage'
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: getProducts
  /products/{slug}:
    get:
      tags:
        - محصولات
      summary: Get an active product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
              example:
                data:
                  id: 1
                  category_id: 1
                  name: example
                  slug: example
                  sku: example
                  summary: example
                  description: example
                  specifications:
                    - label: example
                      value: example
                  additional_description: example
                  usage: example
                  price: 1
                  old_price: 1
                  stock: 1
                  rating: 1
                  image: example
                  gallery:
                    - example
                  is_featured: false
                  is_active: false
                  category:
                    id: 1
                    name: example
                    slug: example
                    description: example
                    image: example
                    is_active: false
                    sort_order: 1
                    products_count: 1
                  views_count: 1
                  comments:
                    - id: 1
                      product_id: 1
                      user_id: 1
                      name: example
                      rating: 1
                      body: example
                      is_approved: false
                      created_at: '2026-11-06T10:00:00Z'
                      updated_at: '2026-11-06T10:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getProductsSlug
      description: هر مشاهده، views_count را افزایش می‌دهد؛ دسته‌بندی و دیدگاه‌های تأییدشده نیز برمی‌گردند.
  /products/{slug}/comments:
    get:
      tags:
        - دیدگاه‌ها
      summary: List approved product comments
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approved comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
              example:
                data:
                  - id: 1
                    product_id: 1
                    user_id: 1
                    name: example
                    rating: 1
                    body: example
                    is_approved: false
                    product:
                      id: 1
                      category_id: 1
                      name: example
                      slug: example
                      sku: example
                      summary: example
                      description: example
                      specifications:
                        - label: example
                          value: example
                      additional_description: example
                      usage: example
                      price: 1
                      old_price: 1
                      stock: 1
                      rating: 1
                      image: example
                      gallery:
                        - example
                      is_featured: false
                      is_active: false
                      category:
                        id: 1
                        name: example
                        slug: example
                        description: example
                        image: example
                        is_active: false
                        sort_order: 1
                        products_count: 1
                      views_count: 1
                      comments: []
                    created_at: '2026-11-06T10:00:00Z'
                    updated_at: '2026-11-06T10:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getProductsSlugComments
    post:
      tags:
        - دیدگاه‌ها
      summary: Submit a product comment for moderation
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - rating
                - body
              properties:
                name:
                  type: string
                  maxLength: 100
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                body:
                  type: string
                  maxLength: 2000
            example:
              name: example
              rating: 1
              body: example
      responses:
        '201':
          description: Submitted for moderation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Comment'
                  message:
                    type: string
              example:
                data:
                  id: 1
                  product_id: 1
                  user_id: 1
                  name: example
                  rating: 1
                  body: example
                  is_approved: false
                  product:
                    id: 1
                    category_id: 1
                    name: example
                    slug: example
                    sku: example
                    summary: example
                    description: example
                    specifications:
                      - label: example
                        value: example
                    additional_description: example
                    usage: example
                    price: 1
                    old_price: 1
                    stock: 1
                    rating: 1
                    image: example
                    gallery:
                      - example
                    is_featured: false
                    is_active: false
                    category:
                      id: 1
                      name: example
                      slug: example
                      description: example
                      image: example
                      is_active: false
                      sort_order: 1
                      products_count: 1
                    views_count: 1
                    comments: []
                  created_at: '2026-11-06T10:00:00Z'
                  updated_at: '2026-11-06T10:00:00Z'
                message: example
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: postProductsSlugComments
  /posts:
    get:
      tags:
        - مقالات
      summary: List published blog posts
      responses:
        '200':
          description: Paginated posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
              example:
                current_page: 1
                last_page: 1
                per_page: 1
                total: 1
                from: 1
                to: 1
                path: example
                first_page_url: example
                last_page_url: example
                next_page_url: example
                prev_page_url: example
                links:
                  - url: example
                    label: example
                    active: false
                data:
                  - id: 1
                    title: example
                    slug: example
                    excerpt: example
                    body: example
                    image: example
                    published_at: '2026-11-06T10:00:00Z'
                    views_count: 1
                    created_at: '2026-11-06T10:00:00Z'
                    updated_at: '2026-11-06T10:00:00Z'
      operationId: getPosts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: tag
          in: query
          schema:
            type: string
            maxLength: 80
          description: فیلتر با یک برچسب دقیق
  /posts/{slug}:
    get:
      tags:
        - مقالات
      summary: Get a published post and count its view
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Blog post
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Post'
              example:
                data:
                  id: 1
                  title: example
                  slug: example
                  excerpt: example
                  body: example
                  image: example
                  published_at: '2026-11-06T10:00:00Z'
                  views_count: 1
                  created_at: '2026-11-06T10:00:00Z'
                  updated_at: '2026-11-06T10:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getPostsSlug
  /cart:
    get:
      tags:
        - سبد خرید
      summary: Get or create a guest cart
      parameters:
        - $ref: '#/components/parameters/CartToken'
        - name: cart_token
          in: query
          description: جایگزین X-Cart-Token؛ در صورت ارسال هر دو، هدر اولویت دارد.
          schema:
            type: string
      responses:
        '200':
          description: Cart with items and products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
              example:
                data:
                  id: 1
                  token: c2481c00-0175-4d40-b95d-50b89f8cb240
                  user_id: 1
                  items:
                    - id: 1
                      cart_id: 1
                      product_id: 1
                      quantity: 1
                      product:
                        id: 1
                        category_id: 1
                        name: example
                        slug: example
                        sku: example
                        summary: example
                        description: example
                        specifications:
                          - label: example
                            value: example
                        additional_description: example
                        usage: example
                        price: 1
                        old_price: 1
                        stock: 1
                        rating: 1
                        image: example
                        gallery:
                          - example
                        is_featured: false
                        is_active: false
                        category:
                          id: 1
                          name: example
                          slug: example
                          description: example
                          image: example
                          is_active: false
                          sort_order: 1
                          products_count: 1
                        views_count: 1
                        comments:
                          - id: 1
                            product_id: 1
                            user_id: 1
                            name: example
                            rating: 1
                            body: example
                            is_approved: false
                            created_at: '2026-11-06T10:00:00Z'
                            updated_at: '2026-11-06T10:00:00Z'
      operationId: getCart
      description: اگر توکن ارسال نشود سبد جدید ساخته می‌شود. data.token را ذخیره کنید و برای تمام عملیات سبد ارسال کنید.
  /cart/items:
    post:
      tags:
        - سبد خرید
      summary: Add a product to the cart
      parameters:
        - $ref: '#/components/parameters/CartToken'
        - name: cart_token
          in: query
          description: جایگزین X-Cart-Token؛ در صورت ارسال هر دو، هدر اولویت دارد.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
                - quantity
              properties:
                product_id:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 20
                variant_id:
                  type:
                    - integer
                    - 'null'
                  description: برای محصول متنوع اجباری است؛ موجودی تجمعی همان تنوع بررسی می‌شود.
            example:
              product_id: 1
              quantity: 1
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
              example:
                data:
                  id: 1
                  token: c2481c00-0175-4d40-b95d-50b89f8cb240
                  user_id: 1
                  items:
                    - id: 1
                      cart_id: 1
                      product_id: 1
                      quantity: 1
                      product:
                        id: 1
                        category_id: 1
                        name: example
                        slug: example
                        sku: example
                        summary: example
                        description: example
                        specifications:
                          - label: example
                            value: example
                        additional_description: example
                        usage: example
                        price: 1
                        old_price: 1
                        stock: 1
                        rating: 1
                        image: example
                        gallery:
                          - example
                        is_featured: false
                        is_active: false
                        category:
                          id: 1
                          name: example
                          slug: example
                          description: example
                          image: example
                          is_active: false
                          sort_order: 1
                          products_count: 1
                        views_count: 1
                        comments:
                          - id: 1
                            product_id: 1
                            user_id: 1
                            name: example
                            rating: 1
                            body: example
                            is_approved: false
                            created_at: '2026-11-06T10:00:00Z'
                            updated_at: '2026-11-06T10:00:00Z'
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: postCartItems
  /cart/items/{item}:
    parameters:
      - $ref: '#/components/parameters/CartToken'
      - name: item
        in: path
        required: true
        schema:
          type: integer
      - name: cart_token
        in: query
        description: جایگزین X-Cart-Token؛ در صورت ارسال هر دو، هدر اولویت دارد.
        schema:
          type: string
    patch:
      tags:
        - سبد خرید
      summary: Change cart item quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 20
            example:
              quantity: 1
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
              example:
                data:
                  id: 1
                  token: c2481c00-0175-4d40-b95d-50b89f8cb240
                  user_id: 1
                  items:
                    - id: 1
                      cart_id: 1
                      product_id: 1
                      quantity: 1
                      product:
                        id: 1
                        category_id: 1
                        name: example
                        slug: example
                        sku: example
                        summary: example
                        description: example
                        specifications:
                          - label: example
                            value: example
                        additional_description: example
                        usage: example
                        price: 1
                        old_price: 1
                        stock: 1
                        rating: 1
                        image: example
                        gallery:
                          - example
                        is_featured: false
                        is_active: false
                        category:
                          id: 1
                          name: example
                          slug: example
                          description: example
                          image: example
                          is_active: false
                          sort_order: 1
                          products_count: 1
                        views_count: 1
                        comments:
                          - id: 1
                            product_id: 1
                            user_id: 1
                            name: example
                            rating: 1
                            body: example
                            is_approved: false
                            created_at: '2026-11-06T10:00:00Z'
                            updated_at: '2026-11-06T10:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
      operationId: patchCartItemsItem
    delete:
      tags:
        - سبد خرید
      summary: Remove an item from the cart
      responses:
        '204':
          description: Item removed
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: deleteCartItemsItem
  /orders:
    post:
      tags:
        - سفارش‌ها
      summary: ثبت سفارش مهمان یا کاربر واردشده
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              customer_name: کاربر نمونه
              phone: '09120000000'
              address: تهران، آدرس نمونه
              payment_method: online
              items:
                - product_id: 1
                  quantity: 1
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
