                            - 'null'
                        image_links:
                          type: array
                          items:
                            type: string
                        spec:
                          type: object
                          additionalProperties: true
                        short_desc:
                          type: string
                        date_added:
                          type: string
                          format: date-time
                        date_updated:
                          type: string
                          format: date-time
        '400':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
