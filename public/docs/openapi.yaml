      tags:
        - اتصال پلتفرم‌ها
      operationId: postTorobProductFeed
      summary: خروجی Product API v3 برای دریافت خودکار ترب
      description: >-
        فقط با TOROB_ENABLED=true. این endpoint توسط ترب خوانده می‌شود و ثبت مستقیم محصول یا تضمین نمایش در
        ترب نیست. اندازه صفحه ۱۰۰ است؛ ورودی بدون پارامترهای لازم 400 می‌دهد.
